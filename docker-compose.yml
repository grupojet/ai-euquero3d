version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: e3d-postgres
    environment:
      POSTGRES_USER: euquero3d
      POSTGRES_PASSWORD: euquero3d
      POSTGRES_DB: euquero3d_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U euquero3d"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: e3d-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: e3d-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: euquero3d
      MINIO_ROOT_PASSWORD: euquero3d-secret
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  backend:
    build: ./backend
    container_name: e3d-backend
    environment:
      DATABASE_URL: postgresql://euquero3d:euquero3d@postgres:5432/euquero3d_ai
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: euquero3d
      MINIO_SECRET_KEY: euquero3d-secret
      MINIO_BUCKET: euquero3d-ai
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./backend/app:/app/app

  worker:
    build: ./worker
    container_name: e3d-worker
    environment:
      DATABASE_URL: postgresql://euquero3d:euquero3d@postgres:5432/euquero3d_ai
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: euquero3d
      MINIO_SECRET_KEY: euquero3d-secret
      MINIO_BUCKET: euquero3d-ai
    depends_on:
      - postgres
      - redis
      - minio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build: ./frontend
    container_name: e3d-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
